version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      # The Kotlin plugins share one version and must move together.
      kotlin:
        patterns:
          - org.jetbrains.kotlin.*
          - org.jetbrains.kotlin:*
      androidx:
        patterns:
          - androidx.*
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
